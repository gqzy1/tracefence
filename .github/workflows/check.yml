name: Contract checks
on:
  push:
    paths: ['contracts/**', 'tests/**', '.github/workflows/check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scripted host and validator tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python syntax
        run: python -m py_compile contracts/tracefence.py
